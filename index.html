<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minecraft Music Library</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Segoe UI,Arial,sans-serif;
}

body{
    background:#0f1115;
    color:#fff;
    min-height:100vh;
}


header{
    position:sticky;
    top:0;
    background:#151922ee;
    backdrop-filter:blur(12px);
    border-bottom:1px solid #2a2f3a;
    padding:25px;
    z-index:100;
}


header h1{
    font-size:34px;
    margin-bottom:6px;
}


.converter{
    display:inline-block;
    margin:12px 8px 20px 0;
    padding:10px 16px;
    border-radius:10px;
    background:#1db954;
    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:.2s;
}


.converter:hover{
    background:#18a347;
}


.youtube{
    background:#ff0000;
}


.youtube:hover{
    background:#cc0000;
}


#count{
    color:#9ca3af;
    margin-bottom:20px;
}


#search{
    width:100%;
    padding:14px 18px;
    border:none;
    border-radius:12px;
    background:#252b36;
    color:white;
    font-size:16px;
    outline:none;
}


#search:focus{
    box-shadow:0 0 0 2px #3b82f6;
}


main{
    max-width:900px;
    margin:auto;
    padding:30px;
}


.song{
    border-bottom:1px solid #2a2f3a;
    padding:18px 0;
}


.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}


.left{
    display:flex;
    align-items:center;
    gap:14px;
    flex:1;
    overflow:hidden;
}


.note{
    color:#3b82f6;
    font-size:22px;
}


.title{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:18px;
}


.right{
    display:flex;
    align-items:center;
    gap:10px;
}


button{
    border:none;
    cursor:pointer;
    border-radius:8px;
    padding:8px 14px;
    background:#3b82f6;
    color:white;
    transition:.2s;
}


button:hover{
    background:#2563eb;
}


.report{
    background:#ef4444;
}


.report:hover{
    background:#dc2626;
}


.expand{
    width:42px;
}


.player{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
    margin-left:36px;
}


.player.open{
    max-height:100px;
    margin-top:14px;
}


audio{
    width:100%;
}


.status{
    color:#6ee7b7;
    font-size:14px;
}


#empty{
    display:none;
    text-align:center;
    color:#777;
    margin-top:50px;
}


@media(max-width:650px){

.row{
    flex-direction:column;
    align-items:flex-start;
}


.right{
    width:100%;
}


.right button{
    flex:1;
}


.player{
    margin-left:0;
}

}

</style></head>

<body>


<header>


<h1>
🎵 Minecraft Music Library
</h1>


<a class="converter"
href="https://spotsaver.net"
target="_blank">
🎵 Spotify Converter
</a>


<a class="converter youtube"
href="https://github.com/yt-dlp/yt-dlp"
target="_blank">
📺 YouTube Audio Tools
</a>


<div id="count">
Loading...
</div>


<input
id="search"
type="text"
placeholder="Search songs...">


</header>



<main>


<div id="songs">
</div>


<div id="empty">
No songs found.
</div>


</main><script>

const owner="shawnobro217-art";
const repo="music-for-minecraft";

const container=document.getElementById("songs");


fetch(`https://api.github.com/repos/${owner}/${repo}/contents`)

.then(r=>r.json())

.then(files=>{


const music=files
.filter(f=>/\.(mp3|ogg|wav)$/i.test(f.name))
.sort((a,b)=>a.name.localeCompare(b.name));



document.getElementById("count").textContent =
`${music.length} Song${music.length!==1?"s":""}`;



music.forEach(file=>{


const encoded=file.name
.split("/")
.map(encodeURIComponent)
.join("/");



const url=
`https://${owner}.github.io/${repo}/${encoded}`;



const song=document.createElement("div");

song.className="song";

song.dataset.name=file.name.toLowerCase();



song.innerHTML=`

<div class="row">


<div class="left">

<div class="note">
♪
</div>


<div class="title">
${file.name.replace(/\.[^.]+$/,"")}
</div>


</div>



<div class="right">


<button class="copy">
Copy Link
</button>


<button class="report">
⚠ Report
</button>


<span class="status"></span>


<button class="expand">
▼
</button>


</div>


</div>



<div class="player">


<audio controls preload="none">

<source src="${url}">

</audio>


</div>

`;



const copyBtn=song.querySelector(".copy");

const reportBtn=song.querySelector(".report");

const expandBtn=song.querySelector(".expand");

const player=song.querySelector(".player");

const status=song.querySelector(".status");





// Copy direct file link

copyBtn.onclick=()=>{


navigator.clipboard.writeText(url);


status.textContent="Copied!";


setTimeout(()=>{

status.textContent="";

},1500);


};





// Create GitHub issue

reportBtn.onclick=()=>{


const issueTitle=
"Problem with " + file.name;



const issueBody=
`Song file:
${file.name}


Issue description:
`;



const issueURL =
`https://github.com/${owner}/${repo}/issues/new?title=${encodeURIComponent(issueTitle)}&body=${encodeURIComponent(issueBody)}`;



window.open(issueURL,"_blank");


};






// Expand audio player

expandBtn.onclick=()=>{


const open=
player.classList.toggle("open");


expandBtn.textContent =
open ? "▲" : "▼";


};





container.appendChild(song);



});



filterSongs();


})

.catch(error=>{


console.error(error);


document.getElementById("count").textContent =
"Failed to load songs";


});







// Search system

document
.getElementById("search")
.addEventListener("input",filterSongs);



function filterSongs(){


const text =
document
.getElementById("search")
.value
.toLowerCase();



let visible=0;



document.querySelectorAll(".song")
.forEach(song=>{


const show =
song.dataset.name.includes(text);



song.style.display =
show ? "block" : "none";



if(show){

visible++;

}


});



document.getElementById("empty").style.display =
visible ? "none" : "block";


}


</script>


</body>

</html>
